name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build distributable zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tags are needed to find the previous release for the compare link.

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Check that the tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -E '^ \* Version:' wp-agent-support-layer.php | awk '{print $3}')
          STABLE=$(grep -E '^Stable tag:' readme.txt | awk '{print $3}')
          echo "tag=$TAG header=$HEADER stable=$STABLE"
          test "$TAG" = "$HEADER" && test "$TAG" = "$STABLE"

      - name: Install production dependencies and prefix them
        run: |
          composer install --no-dev --prefer-dist --no-progress --no-interaction
          composer run strauss

      - name: Assemble plugin directory
        run: |
          mkdir -p build/wp-agent-support-layer
          rsync -a --exclude-from=.distignore ./ build/wp-agent-support-layer/
          rm -rf build/wp-agent-support-layer/vendor
          VERSION=$(grep -E '^ \* Version:' wp-agent-support-layer.php | awk '{print $3}')
          (cd build && zip -rq ../wp-agent-support-layer-${VERSION}.zip wp-agent-support-layer)
          ls -la *.zip

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp-agent-support-layer
          path: build/wp-agent-support-layer

      - name: Prepare release notes (main changes from readme.txt, then the full compare link)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Main changes"
            echo
            # The "= X.Y.Z =" section of the readme changelog, first 10 bullets.
            awk -v v="= ${VERSION} =" '$0 == v { on = 1; next } on && /^= / { exit } on && /^\* / { print }' readme.txt | head -10
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${GITHUB_REF_NAME}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Attach zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wp-agent-support-layer-*.zip
          body_path: release-notes.md
          generate_release_notes: false

  deploy-wporg:
    name: Deploy to WordPress.org SVN
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.WPORG_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download built plugin
        uses: actions/download-artifact@v4
        with:
          name: wp-agent-support-layer
          path: build/wp-agent-support-layer

      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: wp-agent-support-layer
          BUILD_DIR: build/wp-agent-support-layer
